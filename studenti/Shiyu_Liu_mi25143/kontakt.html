<!DOCTYPE html>
<html lang="sr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Kontakt</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header>
            <h1>Kontakt</h1>

            <nav>
                <a href="index.html">Pocetna</a>
                <a href="tema.html">O meni</a>
                <a href="kontakt.html">Kontakt</a>
            </nav>
        </header>

        <main>

            <section>
                <h2>Kontaktiraj te me</h2>

                <p>
                    Ukoliko zelite da mi posaljete poruku, mozete koristiti formu ispod.
                </p>

                <form>

                    <label for="ime">ime i prezime:</label>
                    <input type="text"
                            id="ime"
                            name="ime"
                            placeholder="Unesite ime i prezime">
                    
                    <br><br>

                    <label for="email">Email:</label>
                    <input type="text"
                            id="email"
                            name="email"
                            placeholder="indeks@alas.matf.bg.ac.rs">

                    <br><br>

                    <label for="tema">Tema poruke:</label>
                    <input type="text"
                            id="tema"
                            name="tema"
                            placeholder="Unesite temu">

                    <br><br>

                    <label for="poruka">Poruka:</label>

                    <br>
                    
                    <textarea id="poruka"
                                name="poruka"
                                rows="7"
                                placeholder="Napisite poruku..."></textarea>

                    <br><br>

                    <button type="submit">Posalji poruku</button>

                    </form>

            </section>
        </main>

        <footer>
            <p>&copy;2026.9.19</p>
        </footer>
    </body>
</html>
