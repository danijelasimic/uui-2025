<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h2>ĐN</h2>

            <ul>
                <li><a href="index.html">Početna</a></li>
                <li><a href="tema.html">Seminarski</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Kontaktirajte me:</h1>

        <div class="contact-container">

            <form>
                <label>Ime i Prezime</label>
                <input type="text" placeholder="Unesite ime">

                <label>Email</label>
                <input type="email" placeholder="Unesite email">

                <label>Poruka</label>
                <textarea rows="6" placeholder="Poruka"></textarea>

                <button type="submit">
                    Send
                </button>
            </form>

            <div class="form-image">
                <img src="slike/form.png" alt="Kontakt ilustracija">
            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 Đorđe Nikolić</p>
    </footer>

</body>

</html>
